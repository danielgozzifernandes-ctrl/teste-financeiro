name: Monthly Report

on:
  schedule:
    # 08:00 Brasília (11:00 UTC) nos dias 1–7; o gate do calendário deixa
    # rodar só no primeiro pregão do mês.
    - cron: "0 11 1-7 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não envia ao Telegram)"
        type: boolean
        default: false
      date:
        description: "Data de referência (YYYY-MM-DD, opcional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: history-writer
  cancel-in-progress: false

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Pula dia sem pregão; weekly/monthly rodam no primeiro pregão do período.
      - name: Check B3 calendar
        id: gate
        if: github.event_name == 'schedule'
        run: python3 tools/schedule_gate.py monthly

      - name: Set up Python 3.11
        if: steps.gate.outputs.run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run != 'false'
        run: pip install -r requirements.txt

      - name: Restore data cache
        if: steps.gate.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-cache-${{ runner.os }}-

      - name: Run monthly report
        if: steps.gate.outputs.run != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAPI_TOKEN:        ${{ secrets.BRAPI_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          DRY_FLAG=""
          SEND_FLAG="--send"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            SEND_FLAG=""
          fi

          python main.py --mode monthly $DATE_ARG $DRY_FLAG $SEND_FLAG

      - name: Save data cache
        if: always() && steps.gate.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}

      # Persiste histórico/análises via git commit (ver weekly_report.yml).
      - name: Commit history artifacts
        if: always() && steps.gate.outputs.run != 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add -A data/history data/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem artefatos novos para commitar."
          else
            git commit -m "chore(data): monthly snapshot/recomendação/backtest [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload chart artifact
        if: always() && steps.gate.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: monthly-chart-${{ github.run_id }}
          path: output/chart_*.png
          if-no-files-found: ignore
          retention-days: 90
