name: Daily Closing Report

on:
  schedule:
    # Segunda a sexta às 18:00 Brasília (UTC-3) = 21:00 UTC
    # B3 fecha às 17:30 (leilão até 17:55) — às 21:00 UTC os dados já estão disponíveis
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não envia ao Telegram)"
        type: boolean
        default: false
      date:
        description: "Data de referência (YYYY-MM-DD, opcional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: history-writer
  cancel-in-progress: false

jobs:
  closing-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout traz data/history versionado (o weekly já commitou o top 5).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Pula dia sem pregão; weekly/monthly rodam no primeiro pregão do período.
      - name: Check B3 calendar
        id: gate
        if: github.event_name == 'schedule'
        run: python3 tools/schedule_gate.py daily

      - name: Set up Python 3.11
        if: steps.gate.outputs.run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run != 'false'
        run: pip install -r requirements.txt

      - name: Run closing report
        if: steps.gate.outputs.run != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAPI_TOKEN:        ${{ secrets.BRAPI_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          DRY_FLAG=""
          SEND_FLAG="--send"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            SEND_FLAG=""
          fi

          python main_daily.py --mode closing $DATE_ARG $DRY_FLAG $SEND_FLAG

      - name: Archive B3 index portfolios
        if: always()
        run: python tools/archive_index_portfolios.py

      # Persiste eventuais snapshots de fechamento gerados (ver weekly_report.yml).
      - name: Commit history artifacts
        if: "!cancelled() && steps.gate.outputs.run != 'false'"
        run: |
          bash tools/commit_artifacts.sh "chore(data): closing snapshot [skip ci]"

      - name: Upload closing chart
        if: always() && steps.gate.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: closing-chart-${{ github.run_id }}
          path: output/closing_chart_*.png
          if-no-files-found: ignore
          retention-days: 7
