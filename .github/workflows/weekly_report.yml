name: Weekly Report

on:
  schedule:
    # Segunda-feira às 08:00 Brasília (UTC-3) = 11:00 UTC
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não envia ao Telegram)"
        type: boolean
        default: false
      date:
        description: "Data de referência (YYYY-MM-DD, opcional)"
        type: string
        default: ""

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restaura cache de dados (TTL 24h, evita re-download desnecessário)
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-cache-${{ runner.os }}-

      # Restaura snapshots históricos (necessários para backtesting)
      - name: Restore snapshots
        uses: actions/cache@v4
        with:
          path: data/snapshots/
          key: snapshots-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            snapshots-${{ runner.os }}-

      - name: Run weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAPI_TOKEN:        ${{ secrets.BRAPI_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          DRY_FLAG=""
          SEND_FLAG="--send"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            SEND_FLAG=""
          fi

          python main.py --mode weekly $DATE_ARG $DRY_FLAG $SEND_FLAG

      # Persiste cache e snapshots gerados nesta execução
      - name: Save data cache
        if: always()
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Save snapshots
        if: always()
        uses: actions/cache@v4
        with:
          path: data/snapshots/
          key: snapshots-${{ runner.os }}-${{ github.run_id }}

      # Salva o gráfico como artefato para inspeção manual
      - name: Upload chart artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-chart-${{ github.run_id }}
          path: output/chart_*.png
          if-no-files-found: ignore
          retention-days: 30
