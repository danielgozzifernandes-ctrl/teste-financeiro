name: Weekly Report

on:
  schedule:
    # 08:00 Brasília (11:00 UTC) em dia útil; o gate do calendário deixa
    # rodar só no primeiro pregão da semana (terça se segunda for feriado).
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não envia ao Telegram)"
        type: boolean
        default: false
      date:
        description: "Data de referência (YYYY-MM-DD, opcional)"
        type: string
        default: ""

# Necessário para o GITHUB_TOKEN poder commitar os artefatos de volta ao repo.
permissions:
  contents: write

# Evita corrida entre runs concorrentes que commitam no mesmo branch.
concurrency:
  group: history-writer
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # persist-credentials: true (default) é necessário para o push final.
          persist-credentials: true

      # Pula dia sem pregão; weekly/monthly rodam no primeiro pregão do período.
      - name: Check B3 calendar
        id: gate
        if: github.event_name == 'schedule'
        run: python3 tools/schedule_gate.py weekly

      - name: Set up Python 3.11
        if: steps.gate.outputs.run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run != 'false'
        run: pip install -r requirements.txt

      # Cache APENAS de dados regeneráveis (downloads brapi/yfinance, TTL 24h).
      # O histórico (data/history) NÃO é cacheado — é versionado no git (step final).
      - name: Restore data cache
        if: steps.gate.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-cache-${{ runner.os }}-

      - name: Run weekly report
        if: steps.gate.outputs.run != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAPI_TOKEN:        ${{ secrets.BRAPI_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          DRY_FLAG=""
          SEND_FLAG="--send"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            SEND_FLAG=""
          fi

          python main.py --mode weekly $DATE_ARG $DRY_FLAG $SEND_FLAG

      - name: Save data cache
        if: always() && steps.gate.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}

      # data/history só acumula entre runs se for commitado — o cache do
      # Actions expira em ~7 dias. IC, backtest e walk-forward dependem disso.
      - name: Commit history artifacts
        if: always() && steps.gate.outputs.run != 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pull --rebase para reduzir corrida com daily/monthly workflows.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add -A data/history data/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem artefatos novos para commitar."
          else
            git commit -m "chore(data): weekly snapshot/recomendação/backtest [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload chart artifact
        if: always() && steps.gate.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-chart-${{ github.run_id }}
          path: output/chart_*.png
          if-no-files-found: ignore
          retention-days: 30
