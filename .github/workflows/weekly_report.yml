name: Weekly Report

on:
  schedule:
    # Segunda-feira às 08:00 Brasília (UTC-3) = 11:00 UTC
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não envia ao Telegram)"
        type: boolean
        default: false
      date:
        description: "Data de referência (YYYY-MM-DD, opcional)"
        type: string
        default: ""

# Necessário para o GITHUB_TOKEN poder commitar os artefatos de volta ao repo.
permissions:
  contents: write

# Evita corrida entre runs concorrentes que commitam no mesmo branch.
concurrency:
  group: history-writer
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # persist-credentials: true (default) é necessário para o push final.
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache APENAS de dados regeneráveis (downloads brapi/yfinance, TTL 24h).
      # O histórico (data/history) NÃO é cacheado — é versionado no git (step final).
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-cache-${{ runner.os }}-

      - name: Run weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAPI_TOKEN:        ${{ secrets.BRAPI_TOKEN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          DRY_FLAG=""
          SEND_FLAG="--send"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            SEND_FLAG=""
          fi

          python main.py --mode weekly $DATE_ARG $DRY_FLAG $SEND_FLAG

      - name: Save data cache
        if: always()
        uses: actions/cache@v4
        with:
          path: cache/
          key: data-cache-${{ runner.os }}-${{ github.run_id }}

      # Persiste o histórico e as análises COMMITANDO no repositório.
      # Sem isso, data/history nunca acumula entre runs e o IC/backtest/walk-forward
      # ficam permanentemente sem amostra (cache do Actions expira em ~7 dias e
      # nunca volta ao git). Este é o mecanismo que faz o sistema "aprender".
      - name: Commit history artifacts
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pull --rebase para reduzir corrida com daily/monthly workflows.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add -A data/history data/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem artefatos novos para commitar."
          else
            git commit -m "chore(data): weekly snapshot/recomendação/backtest [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload chart artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-chart-${{ github.run_id }}
          path: output/chart_*.png
          if-no-files-found: ignore
          retention-days: 30
